name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      # No ANTHROPIC_API_KEY is set anywhere in this workflow. That is
      # deliberate: every LLM path has a rule-based fallback and the suite must
      # pass without one.
      - name: Lint (unused imports, undefined names)
        run: python -m pyflakes .

      - name: Tests
        run: python -m pytest -q

      - name: Demo runs end to end
        run: python main_taaa.py demo
